# Agent Studio configuration. Model names and budgets live here, never in code.

models:
  # Tiers map to concrete model IDs. Verify against current docs before Phase 2.
  strong: claude-opus-5-5
  fast: claude-haiku-5-5
  # The Claude model for the Developer (when its backend is Claude, not the local model below).
  developer: claude-sonnet-5-5

budget:
  project_cap_usd: 20.0
  # Halt and ask the human once spend reaches this fraction of the cap.
  warn_at_fraction: 0.8
  # Placeholder caps for each stage as a whole (all tasks summed); tune against
  # measured cost after Phase 7. The project cap above is what limits total spend.
  stage_caps_usd:
    product_owner: 1.5
    architect: 2.5
    developer: 3.0
    qa: 2.5
    career_coach: 2.0

limits:
  max_revisions: 3 # per stage, then ask the human
  max_replans: 2 # times the Developer may send the project back to the Architect about a design problem
  max_qa_loops: 2 # rounds of automatic fixes (Architect plans, Developer builds, QA reruns); 0 = ask the human at once
  max_moves: 40 # agent visits after which the orchestrator stops choosing and uses the usual order
  max_task_usd: 2.0 # one Developer task; the SDK stops the run at this spend
  max_web_searches: 5 # per agent call, for agents allowed to search the web
  max_turns: # per agent run
    product_owner: 20
    architect: 20
    developer: 80
    qa: 20
    career_coach: 20

pricing:
  # Dollars per million tokens, by tier (Anthropic pricing page, checked 2026-11-04). The raw API
  # reports token counts but not dollars, so the budget uses these. Re-check when models change.
  strong: # claude-opus-5-5
    input: 4.0
    output: 20.0
    cache_read: 0.2
    cache_write: 5.0
  fast: # claude-haiku-5-5, prompts up to 100K tokens
    input: 0.1
    output: 0.5
    cache_read: 0.01
    cache_write: 0.125
  web_search_usd_per_request: 0.01 # $10 per 1,000 searches

qa:
  # The tools the QA stage runs in a throwaway worktree of the finished project (Python projects).
  # `uv run --with X` adds a tool next to the project's own dependencies without changing them.
  # A check whose `requires` program is not installed is "skipped", and a skipped check fails the
  # report, so a missing scanner is never mistaken for a clean scan.
  timeout_seconds: 300 # per check
  tail_lines: 40 # lines of each check's output kept in the report
  checks:
    - {name: tests, command: "uv run pytest -q", requires: uv}
    - {name: lint, command: "uv run --with ruff ruff check .", requires: uv}
    - {name: types, command: "uv run --with mypy mypy .", requires: uv}
    - {name: dependency audit, command: "uv run --with pip-audit pip-audit", requires: uv}
    - {name: secret scan, command: "gitleaks detect --no-banner --redact", requires: gitleaks}

sandbox:
  # The only hosts the Developer's sandbox may reach without asking you: the package registries, so
  # installing a dependency works. Any other host is shown to you first, and this machine and
  # private networks are never allowed. Edit this list here; the agent cannot change config.yaml.
  allowed_domains:
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org

assistant:
  # The chat assistant (read-only on the code; everything consequential is a proposal you confirm).
  max_chat_usd: 1.0 # one chat ends here; its cost is shown apart from the project's spend
  max_turns: 15 # tool steps the assistant may take to answer one message

local:
  # An open-source model for the Developer, served by Ollama on this computer. Choose it per
  # project (or as the default) on the Models page. The tag must match `ollama list`; Claude Code
  # needs a context of at least min_context, so start Ollama with OLLAMA_CONTEXT_LENGTH=65536.
  endpoint: http://localhost:11434
  model: qwen3-coder:30b
  min_context: 65536

developer:
  # Skills from this repo's .claude/skills folder that the Developer must follow on every task
  # (they are added to its instructions, since it cannot see this repo's .claude folder).
  skills:
    - tdd
