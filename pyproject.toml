[project]
name = "agent-studio"
version = "0.1.0"
description = "Human-gated multi-agent development pipeline on the Claude Agent SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
studio = "orchestrator.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["orchestrator", "tests"]
