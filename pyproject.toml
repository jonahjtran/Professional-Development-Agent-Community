[project]
name = "agent-studio"
version = "0.1.0"
description = "Human-gated multi-agent development pipeline on the Claude Agent SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.5.0",
    "claude-agent-sdk>=0.2.178",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
studio = "orchestrator.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "schemas", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API and costs money (opt-in with --live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["orchestrator", "schemas", "evals", "tests"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
